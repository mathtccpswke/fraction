<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>分數計算器進階版</title>
    <style>
        body {
            font-family: "Inter", "Helvetica Neue", Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            color: #333;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* 防止整頁滑動，交由內部 scroll-area 處理 */
        }
        
        .header-title {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: #0369a1;
            padding: 15px 0 5px 0;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        .scroll-area {
            flex: 1; /* 佔滿剩餘空間 */
            overflow-y: auto; /* 允許內部上下滑動 */
            -webkit-overflow-scrolling: touch; /* 讓手機滑動更順暢 */
            padding: 10px 20px;
        }

        .app-container {
            max-w-full;
            width: 100%;
            max-width: 800px;
            margin: 0 auto; /* 水平置中 */
            background-color: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            padding: 25px;
            box-sizing: border-box;
            border: 2px solid #fff;
        }

        .tabs {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            background: #f1f5f9;
            border-radius: 12px;
            padding: 5px;
        }
        .tab {
            padding: 12px 24px;
            cursor: pointer;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.3s;
            flex: 1;
            text-align: center;
            color: #64748b;
        }
        .tab.active {
            background-color: #38bdf8;
            color: white;
            box-shadow: 0 4px 6px rgba(56, 189, 248, 0.3);
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .input-section {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        .fractions-row {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap; /* 算式過長時自動換行 */
            gap: 15px;
            background: #f8fafc;
            padding: 20px;
            border-radius: 15px;
            border: 1px dashed #cbd5e1;
            width: 100%;
            box-sizing: border-box;
        }

        .fraction-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .fraction-input {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .whole-input {
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            border: 2px solid #bae6fd;
            border-radius: 10px;
            outline: none;
            transition: border-color 0.3s;
        }
        .whole-input:focus { border-color: #38bdf8; }
        
        .num-den-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        .num-den-col input {
            width: 45px;
            height: 35px;
            text-align: center;
            font-size: 18px;
            border: 2px solid #bae6fd;
            border-radius: 8px;
            outline: none;
        }
        .num-den-col input:focus { border-color: #38bdf8; }
        .fraction-line-input {
            width: 100%;
            height: 3px;
            background-color: #94a3b8;
            border-radius: 2px;
        }

        .paren-btn {
            font-size: 22px;
            font-weight: bold;
            color: #ccc;
            cursor: pointer;
            user-select: none;
            padding: 0 5px;
            transition: color 0.3s;
        }
        .paren-btn.active { color: #0284c7; }
        
        .op-select {
            font-size: 20px;
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            background: white;
            outline: none;
            cursor: pointer;
            color: #0f172a;
            font-weight: bold;
        }

        .calc-btn {
            background: linear-gradient(135deg, #38bdf8 0%, #0284c7 100%);
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(2, 132, 199, 0.4);
        }
        .calc-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(2, 132, 199, 0.6);
        }
        .calc-btn:active { transform: translateY(1px); }

        .result-container {
            margin-top: 25px;
            display: none;
            flex-direction: column;
            gap: 15px;
        }
        
        .step-box {
            background: #f0fdf4;
            border-left: 5px solid #22c55e;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }
        .step-title {
            font-size: 14px;
            color: #166534;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .frac-render {
            display: inline-flex;
            align-items: center;
            font-size: 22px;
            font-weight: bold;
            color: #1e293b;
            margin: 0 5px;
        }
        .frac-whole { margin-right: 4px; }
        .frac-col {
            display: inline-flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .frac-num { font-size: 18px; line-height: 1.1; }
        .frac-den { font-size: 18px; line-height: 1.1; }
        .frac-line {
            width: 100%;
            height: 2px;
            background-color: #1e293b;
            margin: 2px 0;
        }
        
        .error-box {
            background: #fef2f2;
            border: 2px solid #f87171;
            color: #b91c1c;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: bold;
        }

        .final-box {
            background: #fffbeb;
            border: 2px solid #fbbf24;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(251, 191, 36, 0.2);
        }
        .final-title { color: #b45309; font-weight: bold; margin-bottom: 10px; font-size: 18px;}

        .watermark {
            text-align: center;
            padding: 10px 0;
            font-size: 16px;
            font-weight: bold;
            color: #14532d; /* 深綠色 */
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(5px);
            border-top: 1px solid rgba(255,255,255,0.5);
            pointer-events: none; /* 滑動時不會被標籤阻擋 */
        }
    </style>
</head>
<body>

    <!-- 大標題 -->
    <div class="header-title">✨ 分數計算器 ✨</div>

    <!-- 獨立滑動區塊 -->
    <div class="scroll-area">
        <div class="app-container">
            
            <div class="tabs">
                <div class="tab active" onclick="switchTab(0)">四則運算</div>
                <div class="tab" onclick="switchTab(1)">分數約簡</div>
            </div>

            <div id="tab-0" class="tab-content active">
                <div class="input-section">
                    <div style="font-weight: bold; color: #475569; font-size: 16px;">
                        運算分數數量：
                        <select id="frac-count" class="op-select" style="margin-left:10px;" onchange="buildFractionInputs()">
                            <option value="2">2 個分數</option>
                            <option value="3">3 個分數</option>
                            <option value="4">4 個分數</option>
                        </select>
                    </div>

                    <div id="dynamic-inputs" class="fractions-row">
                        <!-- JS 動態產生輸入框 -->
                    </div>

                    <button class="calc-btn" onclick="startArithmetic()">開始計算 🚀</button>
                </div>
                <div id="result-arithmetic" class="result-container"></div>
            </div>

            <div id="tab-1" class="tab-content">
                <div class="input-section">
                    <div style="font-weight: bold; color: #475569; font-size: 18px;">請輸入分數</div>
                    <div class="fractions-row">
                        <div class="fraction-input">
                            <input type="number" id="red-w" class="whole-input" placeholder="整">
                            <div class="num-den-col">
                                <input type="number" id="red-n" placeholder="分">
                                <div class="fraction-line-input"></div>
                                <input type="number" id="red-d" placeholder="母">
                            </div>
                        </div>
                    </div>
                    <button class="calc-btn" onclick="startReduction()">直接約簡 ✨</button>
                </div>
                <div id="result-reduction" class="result-container"></div>
            </div>

        </div>
    </div>

    <!-- 獨立固定在下方的浮水印 -->
    <div class="watermark">TCCPSWKE 數學組</div>

    <script>
        window.onload = function() {
            buildFractionInputs();
        };

        function switchTab(index) {
            document.querySelectorAll('.tab').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.querySelectorAll('.tab-content').forEach((t, i) => {
                t.classList.toggle('active', i === index);
            });
            document.getElementById('result-arithmetic').style.display = 'none';
            document.getElementById('result-reduction').style.display = 'none';
        }

        function buildFractionInputs() {
            const count = parseInt(document.getElementById('frac-count').value);
            const container = document.getElementById('dynamic-inputs');
            container.innerHTML = '';

            for (let i = 1; i <= count; i++) {
                let html = `
                <div class="fraction-group">
                    <span class="paren-btn" id="lp${i}" data-active="false" onclick="toggleParen(this, '(')">(</span>
                    <div class="fraction-input">
                        <input type="number" id="w${i}" class="whole-input" placeholder="整">
                        <div class="num-den-col">
                            <input type="number" id="n${i}" placeholder="分">
                            <div class="fraction-line-input"></div>
                            <input type="number" id="d${i}" placeholder="母">
                        </div>
                    </div>
                    <span class="paren-btn" id="rp${i}" data-active="false" onclick="toggleParen(this, ')')">)</span>
                </div>`;
                
                if (i < count) {
                    html += `
                    <select id="op${i}" class="op-select">
                        <option value="+">＋</option>
                        <option value="-">－</option>
                        <option value="*">×</option>
                        <option value="/">÷</option>
                    </select>`;
                }
                container.insertAdjacentHTML('beforeend', html);
            }
        }

        function toggleParen(el, type) {
            let isActive = el.dataset.active === "true";
            el.dataset.active = isActive ? "false" : "true";
            el.classList.toggle('active');
        }

        function getGCD(a, b) {
            a = Math.abs(a); b = Math.abs(b);
            while (b) { let t = b; b = a % b; a = t; }
            return a;
        }

        function getLCM(a, b) {
            if (a === 0 || b === 0) return 0;
            return Math.abs(a * b) / getGCD(a, b);
        }

        function renderFrac(token) {
            let num = token.num;
            let den = token.den;
            let forceImproper = token.forceImproper || false; 
            let borrowCount = token.borrowCount || 0; 

            if (den === 0) return `<span style="color:red;">錯誤(分母為0)</span>`;
            if (num === 0) return `<div class="frac-render">0</div>`;
            
            let isNeg = (num < 0) !== (den < 0);
            num = Math.abs(num);
            den = Math.abs(den);
            
            let html = `<div class="frac-render">`;
            if (isNeg) html += `<span style="margin-right: 4px; color: #ef4444;">-</span>`;
            
            if (den === 1 && borrowCount === 0) {
                html += `${num}</div>`;
                return html;
            }

            let w = 0, n = num;
            
            // 處理退位顯示邏輯：從整數扣除借位，加到分子上
            if (borrowCount > 0 && num >= borrowCount * den) {
                w = Math.floor(num / den) - borrowCount;
                n = (num % den) + borrowCount * den;
            } 
            else if (!forceImproper && num >= den) {
                w = Math.floor(num / den);
                n = num % den;
            }

            if (w > 0) html += `<span class="frac-whole">${w}</span>`;
            if (n > 0 || (n === 0 && borrowCount > 0)) {
                html += `
                <div class="frac-col">
                    <span class="frac-num">${n}</span>
                    <div class="frac-line"></div>
                    <span class="frac-den">${den}</span>
                </div>`;
            }
            html += `</div>`;
            return html;
        }

        function renderTokens(tokens) {
            let html = '';
            for (let t of tokens) {
                if (t.type === 'frac') html += renderFrac(t);
                else if (t.type === 'op') {
                    let opStr = t.val;
                    if(opStr === '*') opStr = '×';
                    if(opStr === '/') opStr = '÷';
                    html += `<span style="font-size:22px; font-weight:bold; margin: 0 8px; color: #475569;">${opStr}</span>`;
                }
                else if (t.type === 'paren') {
                    html += `<span style="font-size:24px; font-weight:bold; color: #0284c7; margin: 0 2px;">${t.val}</span>`;
                }
            }
            return html;
        }

        function showError(msg, containerId) {
            let resContainer = document.getElementById(containerId);
            resContainer.style.display = 'flex';
            resContainer.innerHTML = `<div class="error-box">⚠️ ${msg}</div>`;
        }

        function startArithmetic() {
            const count = parseInt(document.getElementById('frac-count').value);
            let tokens = [];
            
            // 收集輸入
            for (let i = 1; i <= count; i++) {
                if (document.getElementById(`lp${i}`).dataset.active === "true") tokens.push({ type: 'paren', val: '(' });
                
                let wStr = document.getElementById(`w${i}`).value.trim();
                let nStr = document.getElementById(`n${i}`).value.trim();
                let dStr = document.getElementById(`d${i}`).value.trim();
                
                let w = wStr === "" ? 0 : parseInt(wStr);
                let n = nStr === "" ? 0 : parseInt(nStr);
                let d = dStr === "" ? 1 : parseInt(dStr);
                
                if (d === 0) { showError("分母不可為 0，請檢查題目！", 'result-arithmetic'); return; }
                
                let num = (Math.abs(w) * d + n) * (w < 0 ? -1 : 1); 
                tokens.push({ type: 'frac', num: num, den: d, forceImproper: false, borrowCount: 0 });
                
                if (document.getElementById(`rp${i}`).dataset.active === "true") tokens.push({ type: 'paren', val: ')' });
                
                if (i < count) {
                    let op = document.getElementById(`op${i}`).value;
                    tokens.push({ type: 'op', val: op });
                }
            }

            let stepsHTML = '';
            let stepCount = 1;
            
            function addStep(title, currentTokens) {
                stepsHTML += `
                <div class="step-box">
                    <div class="step-title">步驟 ${stepCount++}：${title}</div>
                    <div style="display:flex; align-items:center; flex-wrap:wrap; row-gap: 12px;">
                        ${renderTokens(currentTokens)}
                    </div>
                </div>`;
            }

            addStep("原始題目", tokens);

            let safeLoop = 0;
            while (tokens.length > 1 && safeLoop < 30) {
                safeLoop++;
                
                let lpIdx = -1, rpIdx = -1;
                for(let i=0; i<tokens.length; i++) {
                    if (tokens[i].type === 'paren' && tokens[i].val === '(') lpIdx = i;
                    if (tokens[i].type === 'paren' && tokens[i].val === ')' && lpIdx !== -1) { rpIdx = i; break; }
                }

                let searchStart = lpIdx !== -1 ? lpIdx + 1 : 0;
                let searchEnd = rpIdx !== -1 ? rpIdx : tokens.length;

                // 檢查是否含有乘除法
                let hasMulDiv = false;
                for (let i = searchStart; i < searchEnd; i++) {
                    if (tokens[i].type === 'op' && (tokens[i].val === '*' || tokens[i].val === '/')) {
                        hasMulDiv = true; break;
                    }
                }

                if (!hasMulDiv) {
                    let fracIndices = [];
                    for (let i = searchStart; i < searchEnd; i++) {
                        if (tokens[i].type === 'frac') fracIndices.push(i);
                    }

                    if (fracIndices.length >= 2) {
                        // 1. 全域通分
                        let commonLCM = tokens[fracIndices[0]].den;
                        for (let i = 1; i < fracIndices.length; i++) commonLCM = getLCM(commonLCM, tokens[fracIndices[i]].den);

                        let needsTongFen = false;
                        for (let idx of fracIndices) {
                            if (tokens[idx].den !== commonLCM) { needsTongFen = true; break; }
                        }

                        if (needsTongFen) {
                            for (let idx of fracIndices) {
                                let t = tokens[idx];
                                t.num = t.num * (commonLCM / t.den);
                                t.den = commonLCM;
                            }
                            let msg = fracIndices.length > 2 ? "分母不同，找最小公倍數將這組分數「一起通分」" : "分母不同，找最小公倍數進行通分";
                            addStep(msg, tokens);
                            continue; 
                        }

                        // 2. 全域退位 (模擬計算分子變化)
                        let firstFrac = tokens[fracIndices[0]];
                        if (firstFrac.num > 0 && !firstFrac.forceImproper) {
                            let currentFracNum = (firstFrac.num % commonLCM) + (firstFrac.borrowCount || 0) * commonLCM;
                            let minFracNum = currentFracNum;
                            
                            for(let i = 1; i < fracIndices.length; i++) {
                                let op = tokens[fracIndices[i] - 1].val;
                                let fNum = Math.abs(tokens[fracIndices[i]].num) % commonLCM;
                                if (op === '+') currentFracNum += fNum;
                                else if (op === '-') currentFracNum -= fNum;
                                
                                if (currentFracNum < minFracNum) minFracNum = currentFracNum;
                            }

                            if (minFracNum < 0) {
                                let borrowNeeded = Math.ceil(-minFracNum / commonLCM);
                                let wholeNum = Math.floor(firstFrac.num / commonLCM) - (firstFrac.borrowCount || 0);
                                
                                if (wholeNum >= borrowNeeded) {
                                    firstFrac.borrowCount = (firstFrac.borrowCount || 0) + borrowNeeded;
                                    let borrowMsg = borrowNeeded > 1 ? `分數部分不夠減，向整數一次過借 ${borrowNeeded} (退位)` : "分數部分不夠減，向整數借 1 (退位)";
                                    addStep(borrowMsg, tokens);
                                    continue;
                                }
                            }
                        }

                        // 3. 全域計算相加減
                        let finalNum = firstFrac.num;
                        for(let i = 1; i < fracIndices.length; i++) {
                            let op = tokens[fracIndices[i]-1].val;
                            if(op === '+') finalNum += tokens[fracIndices[i]].num;
                            else finalNum -= tokens[fracIndices[i]].num;
                        }
                        
                        let resultFrac = { type: 'frac', num: finalNum, den: commonLCM, forceImproper: false, borrowCount: 0 };
                        let gcd = getGCD(resultFrac.num, resultFrac.den);
                        resultFrac.num /= gcd; resultFrac.den /= gcd;
                        
                        let isAdd = tokens[fracIndices[1]-1].val === '+';
                        
                        tokens.splice(fracIndices[0], fracIndices[fracIndices.length - 1] - fracIndices[0] + 1, resultFrac);
                        
                        if (fracIndices.length > 2) {
                            addStep("由左至右進行連加連減計算並約簡", tokens);
                        } else {
                            let opName = isAdd ? '加法' : '減法';
                            addStep(`進行${opName}計算並約簡`, tokens);
                        }
                        continue;
                    }
                }

                let targetIdx = -1;
                let opType = '';
                
                for(let i=searchStart; i<searchEnd; i++) {
                    if(tokens[i].type === 'op' && tokens[i].val === '/') { targetIdx = i; opType = '/'; break; }
                }
                if(targetIdx === -1) {
                    for(let i=searchStart; i<searchEnd; i++) {
                        if(tokens[i].type === 'op' && tokens[i].val === '*') { targetIdx = i; opType = '*'; break; }
                    }
                }

                if (targetIdx === -1 && lpIdx !== -1 && rpIdx !== -1) {
                    tokens.splice(rpIdx, 1);
                    tokens.splice(lpIdx, 1);
                    addStep("括號內計算完畢，去除括號", tokens);
                    continue;
                }

                if (targetIdx !== -1) {
                    let left = tokens[targetIdx - 1];
                    let right = tokens[targetIdx + 1];
                    let resultFrac = { type: 'frac', num: 0, den: 1, forceImproper: false, borrowCount: 0 };
                    
                    let hasMixed = (Math.abs(left.num) >= left.den && left.den > 1 && !left.forceImproper) || 
                                   (Math.abs(right.num) >= right.den && right.den > 1 && !right.forceImproper);

                    if (opType === '/') {
                        if (hasMixed) {
                            left.forceImproper = true;
                            right.forceImproper = true;
                            addStep("進行除法前，將帶分數化為假分數", tokens);
                            continue; 
                        }
                        
                        tokens[targetIdx].val = '*';
                        let temp = right.num;
                        right.num = right.den;
                        right.den = temp;
                        right.forceImproper = true;
                        left.forceImproper = true;
                        addStep("將除數分子分母顛倒，變為乘法", tokens);
                        continue; 
                    }
                    else if (opType === '*') {
                        if (hasMixed) {
                            left.forceImproper = true;
                            right.forceImproper = true;
                            addStep("進行乘法前，將帶分數化為假分數", tokens);
                            continue; 
                        }
                        resultFrac.num = left.num * right.num;
                        resultFrac.den = left.den * right.den;
                        let gcd = getGCD(resultFrac.num, resultFrac.den);
                        resultFrac.num /= gcd; resultFrac.den /= gcd;
                        resultFrac.forceImproper = true; 
                        tokens.splice(targetIdx - 1, 3, resultFrac);
                        addStep("分子乘分子，分母乘分母，並進行約簡", tokens);
                    }
                }
            }

            if (tokens.length === 1 && tokens[0].type === 'frac') {
                tokens[0].forceImproper = false; 
                tokens[0].borrowCount = 0;
                stepsHTML += `
                <div class="final-box">
                    <div class="final-title">🎉 最終解答 🎉</div>
                    <div style="font-size: 26px; font-weight: bold; color: #0284c7;">
                        ${renderFrac(tokens[0])}
                    </div>
                </div>`;
            }

            let resContainer = document.getElementById('result-arithmetic');
            resContainer.style.display = 'flex';
            resContainer.innerHTML = stepsHTML;
        }

        function startReduction() {
            let wStr = document.getElementById('red-w').value.trim();
            let nStr = document.getElementById('red-n').value.trim();
            let dStr = document.getElementById('red-d').value.trim();
            
            let w = wStr === "" ? 0 : parseInt(wStr);
            let n = nStr === "" ? 0 : parseInt(nStr);
            let d = dStr === "" ? 1 : parseInt(dStr);
            
            if (d === 0) { showError("分母不可為 0！", 'result-reduction'); return; }
            if (n === 0 && w === 0) { showError("請輸入有效的分數", 'result-reduction'); return; }

            let num = (Math.abs(w) * d + n) * (w < 0 ? -1 : 1);
            let gcd = getGCD(num, d);
            
            let resultFrac = { type: 'frac', num: num / gcd, den: d / gcd, forceImproper: false, borrowCount: 0 };
            
            let html = `
            <div class="final-box">
                <div class="final-title">✨ 最簡分數 ✨</div>
                <div style="font-size: 28px; font-weight: bold; color: #059669;">
                    ${renderFrac(resultFrac)}
                </div>
            </div>`;

            let resContainer = document.getElementById('result-reduction');
            resContainer.style.display = 'flex';
            resContainer.innerHTML = html;
        }
    </script>
</body>
</html>
